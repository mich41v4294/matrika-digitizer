[package]
name = "matrika_db_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "matrika_db_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
