services:
  matrika-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - VITE_COMMIT_HASH=${VITE_COMMIT_HASH:-}
        - BUILD_COMMIT_HASH=${BUILD_COMMIT_HASH:-}
        - GIT_COMMIT=${GIT_COMMIT:-}
        - SOURCE_COMMIT=${SOURCE_COMMIT:-}
        - COMMIT_SHA=${COMMIT_SHA:-}
        - GITHUB_SHA=${GITHUB_SHA:-}
    container_name: matrika-digitizer
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PANGOLIN_PUBLIC_URL=${PANGOLIN_PUBLIC_URL:-http://localhost:8080}
      - VITE_COMMIT_HASH=${VITE_COMMIT_HASH:-}
      - BUILD_COMMIT_HASH=${BUILD_COMMIT_HASH:-}
      - GIT_COMMIT=${GIT_COMMIT:-}
      - SOURCE_COMMIT=${SOURCE_COMMIT:-}
      - COMMIT_SHA=${COMMIT_SHA:-}
      - GITHUB_SHA=${GITHUB_SHA:-}
      - APP_API_KEY=${APP_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - AI_BASE_URL=${AI_BASE_URL:-http://host.docker.internal:8080/v1}
      - AI_MODELS_URL=${AI_MODELS_URL:-http://host.docker.internal:8080/v1/models}
      - AI_API_KEY=${AI_API_KEY:-mlx}
      - LOCAL_MAX_CONCURRENT=${LOCAL_MAX_CONCURRENT:-1}
      - MODEL_OCR=${MODEL_OCR:-mlx-community/Qwen3-VL-8B-Instruct-4bit}
      - MODEL_DECISION=${MODEL_DECISION:-LiquidAI/d1-Omni-2B-MLX-8bit}
      - MODEL_EXTRACT=${MODEL_EXTRACT:-LiquidAI/LFM3-Omni-2B-MLX-4bit}
      - MODEL_LAYOUT=${MODEL_LAYOUT:-mlx-community/Qwen3-VL-8B-Instruct-4bit}
      - MODEL_STT=${MODEL_STT:-mlx-community/whisper-large-v3-turbo-asr-fp16}
      - FREELLM_BASE_URL=${FREELLM_BASE_URL:-https://api.openai.com/v1}
      - FREELLM_API_KEY=${FREELLM_API_KEY:-}
      - FREELLM_MODEL=${FREELLM_MODEL:-gpt-4o-mini}
      - DATA_DIR=/app/data
      - MATRIKA_DATA_DIR=${MATRIKA_DATA_DIR:-/app/data/uploads/matrika}
      - CENSUS_DATA_DIR=${CENSUS_DATA_DIR:-/app/data/uploads/slovakiana}
      - SAMPLE_DIR=/app/samples
      - FRONTEND_DIST_DIR=/app/frontend/dist
      - FS_ENV_FILE=/app/data/familysearch.env
      - FS_ENVIRONMENT=${FS_ENVIRONMENT:-production}
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ${HOST_MATRIKA_DATA_DIR:-./data/uploads/matrika}:${MATRIKA_DATA_DIR:-/app/data/uploads/matrika}
      - ${HOST_CENSUS_DATA_DIR:-./data/uploads/slovakiana}:${CENSUS_DATA_DIR:-/app/data/uploads/slovakiana}
      # Optional: if you have local sample scans in ./samples, uncomment below to mount them read-only:
      # - ./samples:/app/samples:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
