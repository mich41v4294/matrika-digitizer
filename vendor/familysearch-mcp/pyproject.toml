[project]
name = "familysearch-mcp"
version = "1.4.0"
description = "MCP server for genealogical research on FamilySearch: a historical place gazetteer, indexed record search, page images, and shared-tree reads."
authors = [
    { name = "Ian Anderson" },
]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=2.0.0,<3.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
familysearch-mcp = "familysearch_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["familysearch_mcp*"]
